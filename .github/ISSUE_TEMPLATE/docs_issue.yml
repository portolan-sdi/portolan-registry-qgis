name: Documentation
description: Report docs that are wrong, missing, or hard to follow
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for helping improve the docs! Please point us to the relevant
        page and explain what needs correcting or clarifying. If the change
        is small and clear, we'd really appreciate a fix PR alongside the issue.

  - type: input
    id: where
    attributes:
      label: Where
      description: >-
        Include the URL or the file and heading. For missing documentation,
        name the page where you expected to find it.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What needs to change?
      description: >-
        Explain what is incorrect, missing, or hard to follow. Include a
        short quote if it helps, and describe what you expected to learn.
    validations:
      required: true

  - type: textarea
    id: reader
    attributes:
      label: Who does this affect?
      description: >-
        Who would use this documentation, and what would they be trying
        to do? Your own experience is a useful example.
    validations:
      required: true

  # issue_governance.py turns the answer into the matching P0 to P3 label,
  # and writing_check.py requires the section. Keep the label "Priority"
  # and the P0 to P3 prefixes. norms/repos.md holds the rubric. Change
  # both in one pull request.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: >-
        How soon does this need work? A maintainer can change it at triage.
        See the [priority rubric](https://github.com/portolan-sdi/portolan-ops/blob/main/norms/repos.md#priority).
      options:
        - "P0: Fix now. Data loss, a leaked secret, wrong published data with no warning, or a broken release."
        - "P1: Fix next. A common workflow fails with no workaround, or a check checks nothing."
        - "P2: Planned. A workaround exists, the case is rare, or the work improves speed or ease of use."
        - "P3: Backlog. An idea, an exploration, or work that waits on another project."
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: How to confirm the fix
      description: >-
        Describe what the page should explain and how a reviewer can
        check that it is correct. Suggest replacement text if you have it.
    validations:
      required: true
