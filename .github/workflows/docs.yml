name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv python install 3.13
          uv sync --locked --only-group docs

      - name: Build documentation
        # Builds the English site into site/, then each translation from
        # docs-i18n/ into site/<lang>/.
        run: uv run --no-sync python scripts/i18n.py build-docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

      # The Pages artifact holds a tarball. The link check needs the plain
      # files, so the site goes up a second time.
      - name: Upload the site for the link check
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site
          retention-days: 7

  # Checks the relative links in the built site. zensical --strict checks
  # Markdown links only. This also covers theme templates, navigation, and
  # raw HTML.
  site-links:
    needs: build
    if: github.event_name == 'pull_request'
    uses: portolan-sdi/portolan-ops/.github/workflows/reusable-links.yml@v1
    permissions:
      contents: read
      # The reusable job declares issues: write for its weekly mode. A
      # caller must grant at least that, even though this mode never
      # writes an issue.
      issues: write
    with:
      site-artifact: documentation-site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # Deploy to GitHub Pages
      id-token: write # OIDC token for Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
