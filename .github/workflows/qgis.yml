# Runs tests/in_qgis inside the official QGIS images. The uv matrix in ci.yml
# cannot import qgis, so the plugin's QGIS, Qt, and network code is tested
# here: on QGIS 3.34, the plugin's minimum version, on Qt5 (QGIS 3.44 LTR),
# and on Qt6 (QGIS 4.2).
name: QGIS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: QGIS ${{ matrix.qgis.name }}
    runs-on: ubuntu-latest
    # A full run takes about 70 seconds, so 8 minutes means a hang.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        qgis:
          - name: "3.34 (Qt5)"
            # qgis/qgis:3.34, digest as of 2026-10-09
            image: qgis/qgis@sha256:6cf6c4b6aa9874c2a3513d18788361fe16a1f947c57b06648e011c17711e0214
          - name: "3.44 (Qt5)"
            # qgis/qgis:3.44, digest as of 2026-09-27
            image: qgis/qgis@sha256:bacafbaf899bb2af5d99dd8a138e0438733aac252ddd5f29d089ad34641bb059
          - name: "4.2 (Qt6)"
            # qgis/qgis:4.2, digest as of 2026-09-27
            image: qgis/qgis@sha256:8996496c15887a8fae0da05fa38103093ddbf104525bcbd67bf733a914fb1444
    container:
      image: ${{ matrix.qgis.image }}
      # gdb attaches to the test process when it hangs. Docker removes this
      # capability by default.
      options: --cap-add=SYS_PTRACE
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        # The image's Debian pytest cannot be upgraded in place. A venv on top
        # of the system site-packages keeps PyQGIS importable. Versions match
        # uv.lock.
        run: |
          python3 -m venv --system-site-packages /tmp/venv
          /tmp/venv/bin/pip install pytest==9.1.1 pytest-timeout==2.4.0 duckdb==1.5.6 babel==2.18.0 pytest-cov==7.1.0 coverage==7.16.2

      - name: Run the QGIS tests
        # The thread method stops a test that hangs inside Qt, GDAL, or a
        # network call, where the signal method cannot reach it. It prints
        # the stack of every thread, so the log shows where the test hung.
        # That thread needs the Python lock. A main thread that holds the lock
        # inside Qt or QGIS stops it, and the job then stops at its limit with
        # no stack. The faulthandler watchdog runs in C, so it prints every
        # stack in that case too.
        # At 5 minutes the run is a hang. Then gdb prints the C++ stack of
        # every thread, which shows the lock or the wait that holds it, and
        # the step stops the run before the job limit.
        # Coverage counts plugin.py, gui, and qgis_io only. The uv suite in
        # ci.yml measures the core.
        shell: bash
        run: |
          /tmp/venv/bin/python -m pytest tests/in_qgis -p no:cacheprovider \
            --timeout 120 --timeout-method=thread -o faulthandler_timeout=100 \
            --cov=portolan_registry_qgis --cov-config=tests/in_qgis/coverage.ini \
            --cov-report=term-missing --cov-fail-under=87 &
          pid=$!
          for _ in $(seq 300); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::warning::The QGIS tests hang. The C++ stack of each thread follows."
            apt-get update -qq
            apt-get install -y -qq gdb > /dev/null
            gdb -p "$pid" -batch -ex "thread apply all bt" || true
            kill "$pid"
          fi
          wait "$pid"
