# Publishes the plugin when a GitHub release is published.
#
# qgis-plugin-ci packages portolan_registry_qgis/ into a zip and attaches it
# to the release. A curl step then uploads the zip to plugins.qgis.org.
#
# The upload asks the site to publish the version when its security scan
# passes. The site does that only when the token's owner is a trusted user
# (permission plugins.can_approve). For any other owner, the site ignores
# the request, and a volunteer approves the version by hand. qgis-plugin-ci
# 2.10.0 cannot send the request, so curl uploads the zip.
#
# One-time setup:
#   1. Create a deployment environment named "plugins-qgis-org".
#   2. Add the secret QGIS_PLUGIN_TOKEN to it, a token from
#      https://plugins.qgis.org for an account that owns the plugin.
#   3. To skip the manual approval, ask for trusted status on the QGIS
#      Developer mailing list. See https://plugins.qgis.org/docs/approval.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: plugins-qgis-org
    permissions:
      contents: write # Attach the zip to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # A publish job must not restore a cache that another run wrote.
          enable-cache: false

      - name: Check that the tag matches metadata.txt
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          declared=$(sed -n 's/^version=//p' portolan_registry_qgis/metadata.txt)
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $TAG does not match metadata.txt version $declared."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package and attach
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          uvx qgis-plugin-ci@2.10.0 release "$VERSION"
          --release-tag "$TAG"
          --github-token "$GH_TOKEN"

      - name: Publish on plugins.qgis.org
        # The site reads auto_approve_after_scan from the token upload. See
        # version_create_api in qgis/QGIS-Plugins-Website.
        env:
          QGIS_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $QGIS_TOKEN" \
            --form "package=@portolan_registry_qgis.$VERSION.zip" \
            --form "auto_approve_after_scan=true" \
            https://plugins.qgis.org/plugins/api/portolan_registry_qgis/version/add/
          echo "Uploaded. See https://plugins.qgis.org/plugins/portolan_registry_qgis/version/$VERSION/"
