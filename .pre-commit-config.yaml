# Synced skeleton for Python repos; extend per repo.
# Run with prek (https://github.com/j178/prek), the Rust pre-commit
# runner CI uses: `uvx prek install --hook-type pre-commit
# --hook-type commit-msg --hook-type pre-push`, then
# `uvx prek run --all-files`.
#
# The pre-push hooks assume these dev dependencies in pyproject.toml:
# mypy, vulture, xenon, deptry, and import-linter where the repo
# declares contracts. CI runs the commit and pre-push stages, so an
# unhooked clone cannot merge past them. commit-msg runs locally only,
# and squash-merge means the pull request title is the commit message
# that lands.
repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  # Lint GitHub Actions workflow syntax and semantics.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Audit workflows for security issues (unpinned actions, missing
  # permissions, template injection). Offline mode keeps it
  # deterministic and token-free.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-online-audits]

  # Copy/paste detector. The hook installs the jscpd wheel from PyPI,
  # so it needs no Node.js. .jscpd.json sets the paths and the size of
  # a clone. Any clone fails the check. Shared code goes in a helper,
  # and a justified copy goes between jscpd:ignore-start and
  # jscpd:ignore-end comments.
  - repo: https://github.com/kucherenko/jscpd
    rev: v5.3.3
    hooks:
      - id: jscpd
        # Scan the whole tree in one pass. A clone has two ends, and the
        # staged files alone can miss the other end.
        pass_filenames: false
        files: \.py$|^\.jscpd\.json$

  # Pre-push stage: the slower quality gates. CI runs these too
  # (reusable-python-ci.yml, "pre-push stage" step).
  # Relative links and anchors, with the org rules. No network access.
  # CI checks external links weekly. See portolan-ops norms/ci.md.
  - repo: https://github.com/portolan-sdi/portolan-ops
    rev: v1.12.0
    hooks:
      - id: lychee

  - repo: local
    hooks:
      # English is the source language. The check fails when a string a
      # person reads skips translation, or when the Spanish or French
      # catalogs, metadata.txt, or docs-i18n/ lag the English.
      - id: i18n
        name: translations
        description: Spanish and French keep level with the English
        entry: uv run python scripts/i18n.py check
        language: system
        pass_filenames: false
        files: ^(portolan_registry_qgis/|docs/|docs-i18n/|mkdocs\.yml$|scripts/i18n\.py$)
        stages: [pre-commit]

      - id: docstrings
        name: docstrings
        description: Docstrings of 5 lines or fewer, with no history
        entry: uv run python scripts/docstring_check.py
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-commit]

      - id: mypy
        name: mypy
        description: Static type check (same gate as CI)
        # The target list lives in [tool.mypy] files in pyproject.toml.
        entry: uv run mypy
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: vulture
        name: vulture
        description: Find unused code (paths/confidence from [tool.vulture])
        entry: uv run vulture
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: xenon
        name: xenon
        description: Complexity gate for the package
        # No block above B, and every module at A.
        entry: uv run xenon --max-absolute=B --max-modules=A --max-average=A portolan_registry_qgis
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: xenon-tests
        name: xenon (tests and scripts)
        description: Complexity gate for the tests and scripts
        # A test that builds a catalog may reach C. Modules stay at B.
        entry: uv run xenon --max-absolute=C --max-modules=B --max-average=A tests scripts
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: deptry
        name: deptry
        description: Unused, missing, and transitive dependencies
        entry: uv run deptry .
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: import-linter
        name: import-linter
        description: Layer contracts, in repos that declare any
        # lint-imports exits non-zero when no contracts exist, so the
        # guard keeps the hook quiet until a repo writes its first
        # [tool.importlinter] block. Adding contracts turns the gate on
        # with no edit here.
        entry: bash -c 'grep -q "^\[tool\.importlinter\]" pyproject.toml && uv run lint-imports || true'
        language: system
        pass_filenames: false
        stages: [pre-push]
