# Coverage of the QGIS suite (.github/workflows/qgis.yml). The uv suite
# measures the core with the settings in pyproject.toml. This run measures
# only the modules that need QGIS: plugin.py, gui, and qgis_io.
[run]
source = portolan_registry_qgis
branch = true
omit =
    */portolan_registry_qgis/__init__.py
    */portolan_registry_qgis/core/*

[report]
show_missing = true
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    if __name__ == .__main__.:
